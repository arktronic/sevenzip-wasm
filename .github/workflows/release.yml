name: Release

defaults:
  run:
    shell: bash

permissions:
  id-token: write  # Required for OIDC
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        type: boolean
        description: Publish npm package
        default: true
      create_release:
        type: boolean
        description: Create GitHub release
        default: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      with:
        submodules: 'true'

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Build container
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf #v7.2.0
      with:
        context: .devcontainer
        push: false
        load: true
        tags: sevenzip-wasm-devcontainer:latest

    - name: Compile
      run: docker run --rm -v $GITHUB_WORKSPACE:/workspace sevenzip-wasm-devcontainer:latest ./build.sh

    - name: Test
      run: |
        cd sevenzip-wasm
        npm ci
        npm test

    - name: Publish setup
      id: setup
      run: |
        cd sevenzip-wasm
        export PACKAGE_VERSION="$(node -p "require('./package.json').version")"
        echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

    - name: Publish to npm
      if: ${{ github.event.inputs.publish_npm == 'true' }}
      run: |
        cd sevenzip-wasm
        npm publish

    - name: Create release file
      if: ${{ github.event.inputs.create_release == 'true' }}
      run: zip -r sevenzip-wasm.zip sevenzip-wasm/package.json sevenzip-wasm/*.js sevenzip-wasm/*.wasm sevenzip-wasm/README* sevenzip-wasm/LICENSE*

    - name: Create release
      if: ${{ github.event.inputs.create_release == 'true' }}
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda #v3.0.0
      with:
        tag_name: ${{ steps.setup.outputs.version }}
        name: ${{ steps.setup.outputs.version }}
        files: sevenzip-wasm.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
